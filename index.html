<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>방송 약력 에디터</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;background:#f4f4f7;color:#2a2233;line-height:1.5}
  .app{display:flex;min-height:100vh}

  .panel{width:360px;flex:none;background:#fff;border-right:1px solid #e5e2ec;padding:20px;overflow-y:auto;height:100vh;position:sticky;top:0}
  .panel h2{font-size:15px;margin:0 0 10px;color:#7c3aed;display:flex;align-items:center;gap:6px}
  .grp{background:#faf9fc;border:1px solid #eceaf2;border-radius:10px;padding:12px;margin-bottom:8px}
  label{display:block;font-size:12px;color:#6b6478;margin:8px 0 4px}
  label:first-child{margin-top:0}
  input[type=text],input[type=number],select,textarea{width:100%;padding:7px 9px;border:1px solid #ddd8e6;border-radius:7px;font-size:13px;font-family:inherit;background:#fff;color:#2a2233}
  input[type=color]{width:100%;height:34px;border:1px solid #ddd8e6;border-radius:7px;background:#fff;cursor:pointer;padding:2px}
  input[type=range]{width:100%;margin:4px 0}
  .row{display:flex;gap:8px}.row>*{flex:1}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 12px;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;transition:filter .15s,transform .1s;width:100%}
  .btn:hover{filter:brightness(1.05)}.btn:active{transform:scale(.98)}
  .btn.primary{background:#7c3aed;color:#fff}.btn.pink{background:#ec4899;color:#fff}.btn.ghost{background:#f0edf6;color:#4a3d63}
  .btn-row{display:flex;gap:8px;margin-top:8px}
  .rng-val{float:right;color:#7c3aed;font-weight:700}
  .swatches{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
  .sw{width:26px;height:26px;border-radius:6px;cursor:pointer;border:2px solid transparent}
  .hint{font-size:11px;color:#9a92aa;margin-top:6px;line-height:1.5}
  .divider{height:1px;background:#eceaf2;margin:16px 0}

  .stage{flex:1;padding:32px;overflow-y:auto;height:100vh}
  .stage-inner{max-width:860px;margin:0 auto}

  #card{--accent:#ec4899;--accent-2:#f472b6;--soft:#fca5c8;--bgA:#ffe0ee;--bgB:#fff5f9;--panel:#fff;--line:#ffd6e7;--ink:#4a2a3a;--muted:#b47a95;--panelSoft:#fff0f6;--fsTitle:48px;--fsH2:22px;--fsBody:15px;--radius:12px;background:radial-gradient(1200px 600px at 50% -200px,var(--bgA) 0%,var(--bgB) 60%);color:var(--ink);border-radius:16px;padding:40px 28px 56px;position:relative;overflow:hidden}
  .c-deco{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:0}
  .c-deco span{position:absolute;line-height:1;user-select:none}
  .c-body{position:relative;z-index:1}
  .c-hero{text-align:center;padding:16px 0 36px}
  .c-badge{display:inline-block;font-size:13px;letter-spacing:2px;color:var(--accent);border:1px solid var(--line);border-radius:999px;padding:6px 16px;margin-bottom:20px}
  .c-title{font-size:var(--fsTitle);font-weight:800;letter-spacing:-1px;line-height:1.15;background:linear-gradient(90deg,var(--soft),var(--accent-2),var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent}
  .c-sub{color:var(--muted);margin-top:12px;font-size:16px}
  .c-sec{margin-top:44px}
  .c-sechead{display:flex;align-items:center;gap:12px;margin-bottom:20px}
  .c-dot{width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px var(--accent);flex:none}
  .c-sechead h2{font-size:var(--fsH2);font-weight:700}
  .c-timeline{padding-left:20px;border-left:2px solid var(--soft)}
  .c-month{font-size:14px;font-weight:700;color:var(--accent);letter-spacing:1px;margin:24px 0 12px}
  .c-month:first-child{margin-top:0}
  .c-event{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:12px 16px;margin-bottom:10px;font-size:var(--fsBody)}
  .c-event.big{background:linear-gradient(120deg,var(--panelSoft),var(--panel));border-color:var(--accent-2)}
  .c-date{color:var(--accent-2);font-weight:700;font-size:13px;margin-right:10px}
  .c-tag{font-size:11px;color:#fff;background:var(--accent);padding:2px 8px;border-radius:6px;font-weight:700;margin-left:6px}
  .c-with{color:var(--muted);font-size:13px}
  .c-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:14px}
  .c-card h3{font-size:15px;color:var(--accent);margin-bottom:12px}
  .c-chip{display:inline-block;font-size:13px;background:var(--panelSoft);border:1px solid var(--line);padding:5px 11px;border-radius:8px;margin:0 6px 8px 0}
  .c-listitem{padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
  .c-listitem:last-child{border-bottom:none}
  .c-fixed{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-bottom:12px}
  .c-fixed .lab{font-size:12px;color:var(--muted);margin-bottom:4px}
  .c-fixed .val{font-size:15px;font-weight:600}
  .c-note{background:linear-gradient(120deg,rgba(236,72,153,.1),transparent);border:1px dashed var(--accent);border-radius:12px;padding:16px 18px;font-size:14px;margin-bottom:12px}
  .c-note .h{color:var(--accent);font-weight:700;margin-bottom:6px}
  .c-note .s{color:var(--muted);font-size:13px}
  .c-foot{text-align:center;color:var(--muted);font-size:13px;margin-top:52px}
  .c-empty{color:var(--muted);font-size:14px;text-align:center;padding:16px;border:1px dashed var(--line);border-radius:10px}

  .item{background:#fff;border:1px solid #e5e2ec;border-radius:8px;padding:8px;margin-bottom:6px}
  .item-top{display:flex;gap:6px;margin-bottom:6px;align-items:center}
  .item-top:last-child{margin-bottom:0}
  .del{background:#fce4ec;color:#d6336c;border:none;border-radius:6px;padding:0 9px;cursor:pointer;font-size:14px;flex:none;height:30px}
  .mv{background:#ede9fe;color:#7c3aed;border:none;border-radius:5px;padding:0 6px;cursor:pointer;font-size:10px;line-height:1.8}
  .mv:disabled{opacity:.3;cursor:default}
  .opts{display:flex;gap:10px;font-size:11px;color:#6b6478;align-items:center;flex-wrap:wrap}
  .opts label{display:inline-flex;align-items:center;gap:3px;margin:0}
  .add-inline{background:#ede9fe;color:#7c3aed;border:1px dashed #c4b5fd;border-radius:7px;padding:7px;cursor:pointer;font-size:12px;font-weight:600;width:100%;margin-top:4px}
  .sub-block{border-left:2px solid #ede9fe;padding-left:8px;margin:6px 0}
  .sub-block>label{font-weight:700;color:#7c3aed}

  .sec-block{background:#fff;border:1px solid #e5e2ec;border-radius:10px;margin-bottom:10px;overflow:hidden}
  .sec-block-head{display:flex;align-items:center;gap:6px;padding:10px;background:#f7f4fc;cursor:pointer;user-select:none}
  .sec-block-head .type-badge{font-size:11px;background:#ede9fe;color:#7c3aed;padding:2px 8px;border-radius:999px;font-weight:700;flex:none}
  .sec-block-head .stitle{flex:1;font-size:13px;font-weight:600;color:#4a3d63;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sec-block-head .caret{color:#b4aac4;flex:none;transition:transform .15s}
  .sec-block.closed .caret{transform:rotate(-90deg)}
  .sec-block.closed .sec-block-body{display:none}
  .sec-block-body{padding:10px}

  .add-menu{position:relative}
  .add-menu-pop{position:absolute;left:0;right:0;bottom:100%;margin-bottom:6px;background:#fff;border:1px solid #ddd8e6;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.12);padding:6px;z-index:20;display:none}
  .add-menu-pop.show{display:block}
  .add-menu-pop button{display:block;width:100%;text-align:left;background:none;border:none;padding:8px 10px;border-radius:6px;font-size:13px;cursor:pointer;font-family:inherit;color:#3a2f4d}
  .add-menu-pop button:hover{background:#f4f0fb}

  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#2a2233;color:#fff;padding:11px 20px;border-radius:10px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:99}
  .toast.show{opacity:1}
  .collapse-h{cursor:pointer;user-select:none}
  .collapse-h::after{content:"▾";float:right;color:#b4aac4}
  .collapsed .collapse-h::after{content:"▸"}
  .collapsed .grp-body{display:none}

  @media(max-width:820px){.app{flex-direction:column}.panel{width:100%;height:auto;position:static;border-right:none;border-bottom:1px solid #e5e2ec}.stage{height:auto}}
</style>
</head>
<body>
<div class="app">
  <div class="panel" id="panel">
    <div class="btn-row">
      <button class="btn pink" onclick="copyHTML()">📋 HTML 복사</button>
      <button class="btn primary" onclick="saveImage()">🖼️ 이미지 저장</button>
    </div>
    <div class="btn-row">
      <button class="btn ghost" onclick="exportJSON()">⬇ JSON 내보내기</button>
      <button class="btn ghost" onclick="document.getElementById('imp').click()">⬆ JSON 불러오기</button>
      <input type="file" id="imp" accept="application/json" style="display:none" onchange="importJSON(event)">
    </div>
    <div class="hint">📋 HTML 복사 시 배경 꾸미기(이모지)는 미포함됩니다. 꾸미기까지 담으려면 🖼️ 이미지 저장을 이용하세요.</div>
    <div class="divider"></div>

    <div class="grp" id="g-head">
      <h2 class="collapse-h" onclick="toggle('g-head')">📝 헤더</h2>
      <div class="grp-body">
        <label>제목</label><input type="text" id="h-title" placeholder="예: 소하 방송 약력" oninput="render()">
        <label>뱃지 (소속 등)</label><input type="text" id="h-badge" placeholder="예: 웰컴버추얼 · 사자컴퍼니" oninput="render()">
        <label>부제 / 설명</label><input type="text" id="h-sub" placeholder="예: 2026.05.01 데뷔 이후의 기록" oninput="render()">
        <label>하단 서명</label><input type="text" id="h-foot" placeholder="예: 소하" oninput="render()">
      </div>
    </div>

    <div class="grp collapsed" id="g-style">
      <h2 class="collapse-h" onclick="toggle('g-style')">🎨 폰트 · 레이아웃</h2>
      <div class="grp-body">
        <label>제목 크기 <span class="rng-val" id="v-fsTitle">48px</span></label><input type="range" id="s-fsTitle" min="24" max="72" value="48" oninput="render()">
        <label>소제목 크기 <span class="rng-val" id="v-fsH2">22px</span></label><input type="range" id="s-fsH2" min="14" max="34" value="22" oninput="render()">
        <label>본문 크기 <span class="rng-val" id="v-fsBody">15px</span></label><input type="range" id="s-fsBody" min="12" max="20" value="15" oninput="render()">
        <label>모서리 둥글기 <span class="rng-val" id="v-radius">12px</span></label><input type="range" id="s-radius" min="0" max="24" value="12" oninput="render()">
        <div class="divider"></div>
        <label>테마 프리셋</label><div class="swatches" id="theme-swatches"></div>
        <div class="row" style="margin-top:10px">
          <div><label>포인트 색</label><input type="color" id="c-accent" value="#ec4899" oninput="customTheme()"></div>
          <div><label>배경 색</label><input type="color" id="c-bg" value="#ffe0ee" oninput="customTheme()"></div>
        </div>
        <div class="row">
          <div><label>카드 배경</label><input type="color" id="c-panel" value="#ffffff" oninput="customTheme()"></div>
          <div><label>글자 색</label><input type="color" id="c-ink" value="#4a2a3a" oninput="customTheme()"></div>
        </div>
      </div>
    </div>

    <div class="grp collapsed" id="g-deco">
      <h2 class="collapse-h" onclick="toggle('g-deco')">✨ 배경 꾸미기</h2>
      <div class="grp-body">
        <label>이모지 (여러 개 붙여쓰기)</label>
        <input type="text" id="d-emojis" placeholder="예: 🌸💖🎀⭐" oninput="render()">
        <div class="swatches" id="deco-presets" style="margin-top:8px"></div>
        <label>개수 <span class="rng-val" id="v-count">18</span></label><input type="range" id="d-count" min="0" max="60" value="18" oninput="render()">
        <label>크기 <span class="rng-val" id="v-size">34px</span></label><input type="range" id="d-size" min="14" max="72" value="34" oninput="render()">
        <label>투명도 <span class="rng-val" id="v-opacity">14%</span></label><input type="range" id="d-opacity" min="3" max="60" value="14" oninput="render()">
        <button class="add-inline" onclick="shuffleDeco()" style="margin-top:10px">🎲 배치 다시 섞기</button>
        <div class="hint">이모지를 여러 개 넣으면 배경에 흩뿌려져요. 개수를 0으로 하면 꾸미기가 꺼져요. 배경 꾸미기는 미리보기·🖼️ 이미지 저장에만 반영되고, 📋 HTML 복사에는 포함되지 않아요.</div>
      </div>
    </div>

    <div class="grp" id="g-sections">
      <h2>🧩 섹션</h2>
      <div id="sections-list"></div>
      <div class="add-menu">
        <div class="add-menu-pop" id="add-pop">
          <button onclick="addSection('timeline')">📅 타임라인</button>
          <button onclick="addSection('chips')">🏷️ 칩 목록 (게임 등)</button>
          <button onclick="addSection('lists')">📋 날짜 리스트 (서버/대회 등)</button>
          <button onclick="addSection('fixed')">📌 고정 컨텐츠</button>
          <button onclick="addSection('notes')">⚠️ 특이사항</button>
        </div>
        <button class="add-inline" onclick="toggleAddMenu(event)">+ 섹션 추가</button>
      </div>
      <div class="hint">같은 종류의 섹션을 여러 개 넣을 수 있어요. 섹션 헤더의 ▲▼로 순서를, ⧉로 복제를, ✕로 삭제해요. 제목을 비우면 그 섹션은 미리보기에서 숨겨져요.</div>
    </div>
  </div>

  <div class="stage"><div class="stage-inner"><div id="card"></div></div></div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ============ DATA MODEL (array-based sections) ============ */
let data = {
  header:{title:"",badge:"",sub:"",foot:""},
  style:{fsTitle:48,fsH2:22,fsBody:15,radius:12,accent:"#ec4899",accent2:"#f472b6",soft:"#fca5c8",bgA:"#ffe0ee",bgB:"#fff5f9",panel:"#ffffff",line:"#ffd6e7",ink:"#4a2a3a",muted:"#b47a95",panelSoft:"#fff0f6"},
  deco:{emojis:"",count:18,size:34,opacity:14,seed:7},
  sections:[]
};

const THEMES={
  "핑크":{accent:"#ec4899",accent2:"#f472b6",soft:"#fca5c8",bgA:"#ffe0ee",bgB:"#fff5f9",panel:"#ffffff",line:"#ffd6e7",ink:"#4a2a3a",muted:"#b47a95",panelSoft:"#fff0f6"},
  "라벤더":{accent:"#a855f7",accent2:"#c084fc",soft:"#d8b4fe",bgA:"#ede0ff",bgB:"#faf5ff",panel:"#ffffff",line:"#e9d5ff",ink:"#3b2a4d",muted:"#9b7bb8",panelSoft:"#f6f0ff"},
  "민트":{accent:"#14b8a6",accent2:"#2dd4bf",soft:"#5eead4",bgA:"#ccf5ee",bgB:"#f0fdfa",panel:"#ffffff",line:"#b8f0e6",ink:"#1f3d38",muted:"#5c9b91",panelSoft:"#effefb"},
  "하늘":{accent:"#3b82f6",accent2:"#60a5fa",soft:"#93c5fd",bgA:"#d6e6ff",bgB:"#f0f6ff",panel:"#ffffff",line:"#c9dcfb",ink:"#233a5c",muted:"#6b86ad",panelSoft:"#eef4ff"},
  "코랄":{accent:"#f97316",accent2:"#fb923c",soft:"#fdba74",bgA:"#ffe4d1",bgB:"#fff7f0",panel:"#ffffff",line:"#ffd9bd",ink:"#4a3020",muted:"#b48c6f",panelSoft:"#fff2e6"},
  "다크":{accent:"#c084fc",accent2:"#f9a8d4",soft:"#7dd3c0",bgA:"#3a2b57",bgB:"#1a1526",panel:"#241d35",line:"#3d3357",ink:"#f3edff",muted:"#a596c9",panelSoft:"#2d2542"}
};
const TYPE_LABEL={timeline:"타임라인",chips:"칩 목록",lists:"날짜 리스트",fixed:"고정 컨텐츠",notes:"특이사항"};
const TYPE_DEFAULTS={
  timeline:()=>({id:uid(),type:"timeline",title:"컨텐츠 타임라인",months:[],open:true}),
  chips:()=>({id:uid(),type:"chips",title:"게임 이력",cards:[],open:true}),
  lists:()=>({id:uid(),type:"lists",title:"서버 & 대회 이력",cards:[],open:true}),
  fixed:()=>({id:uid(),type:"fixed",title:"고정 컨텐츠",items:[],open:true}),
  notes:()=>({id:uid(),type:"notes",title:"특이사항",items:[],open:true})
};

/* ============ HELPERS ============ */
function uid(){return Math.random().toString(36).slice(2,9)}
function esc(s){return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1800)}
function toggle(id){document.getElementById(id).classList.toggle('collapsed')}
function move(arr,i,dir){const j=i+dir;if(j<0||j>=arr.length)return false;const t=arr[i];arr[i]=arr[j];arr[j]=t;return true}
function mkMove(arr,i,onDone){
  const box=document.createElement('span');box.style.cssText="display:inline-flex;gap:2px;flex:none";
  const up=document.createElement('button');up.className="mv";up.textContent="▲";up.title="위로";up.disabled=i===0;up.onclick=ev=>{ev.stopPropagation();if(move(arr,i,-1)){onDone();render()}};
  const dn=document.createElement('button');dn.className="mv";dn.textContent="▼";dn.title="아래로";dn.disabled=i===arr.length-1;dn.onclick=ev=>{ev.stopPropagation();if(move(arr,i,1)){onDone();render()}};
  box.append(up,dn);return box;
}
function deepClone(o){return JSON.parse(JSON.stringify(o))}
function reId(sec){sec.id=uid();(sec.months||[]).forEach(m=>{m.id=uid();(m.events||[]).forEach(e=>e.id=uid())});(sec.cards||[]).forEach(c=>{c.id=uid();(c.rows||[]).forEach(r=>r.id=uid())});(sec.items||[]).forEach(i=>i.id=uid());return sec}

/* seeded RNG so preview & exported HTML match */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return ((t^t>>>14)>>>0)/4294967296}}
const DECO_PRESETS=["🌸💖🎀","⭐✨💫","🎮🕹️👾","🩷💗🤍","🍓🧁🍰","🌙⭐🌸","🎵🎶💜","🐰🌷🎀"];
function buildDeco(heightPx){
  const d=data.deco;
  const list=[...(d.emojis||"").replace(/\s+/g,"")].filter(ch=>/\p{Emoji}/u.test(ch));
  if(!list.length||d.count<=0)return "";
  const rnd=mulberry32((d.seed||1)*2654435761>>>0);
  const usePx=typeof heightPx==="number"&&heightPx>0;
  let out=`<div class="c-deco">`;
  for(let i=0;i<d.count;i++){
    const em=list[Math.floor(rnd()*list.length)];
    // stratified vertical band so emojis spread top-to-bottom evenly (no top clustering)
    const band=(i+rnd())/d.count;              // 0..1 across full height
    const vpct=Math.min(99,Math.max(1,band*100));
    const left=(rnd()*100).toFixed(2);
    const rot=(rnd()*60-30).toFixed(1);
    const scale=(0.7+rnd()*0.6).toFixed(2);
    const fs=Math.round(d.size*scale);
    const topStyle=usePx?`top:${Math.round(band*heightPx)}px`:`top:${vpct.toFixed(2)}%`;
    out+=`<span style="${topStyle};left:${left}%;font-size:${fs}px;opacity:${(d.opacity/100).toFixed(2)};transform:translate(-50%,-50%) rotate(${rot}deg)">${em}</span>`;
  }
  out+=`</div>`;
  return out;
}
function shuffleDeco(){data.deco.seed=Math.floor(Math.random()*100000);render()}

function toggleAddMenu(e){e.stopPropagation();document.getElementById('add-pop').classList.toggle('show')}
document.addEventListener('click',()=>document.getElementById('add-pop').classList.remove('show'));

function cloneSection(i){const c=reId(deepClone(data.sections[i]));c.title=(c.title||"")+" (복사)";data.sections.splice(i+1,0,c);buildSectionsPanel();render()}

/* ============ PANEL: SECTIONS ============ */
function buildSectionsPanel(){
  const box=document.getElementById('sections-list');box.innerHTML="";
  data.sections.forEach((sec,si)=>{
    const block=document.createElement('div');block.className="sec-block"+(sec.open?"":" closed");
    const head=document.createElement('div');head.className="sec-block-head";
    const badge=document.createElement('span');badge.className="type-badge";badge.textContent=TYPE_LABEL[sec.type];
    const st=document.createElement('span');st.className="stitle";st.textContent=sec.title||"(제목 없음)";
    const mv=mkMove(data.sections,si,buildSectionsPanel);
    const clone=document.createElement('button');clone.className="mv";clone.textContent="⧉";clone.title="복제";clone.onclick=e=>{e.stopPropagation();cloneSection(si)};
    const del=document.createElement('button');del.className="del";del.textContent="✕";del.onclick=e=>{e.stopPropagation();delSection(si)};
    const caret=document.createElement('span');caret.className="caret";caret.textContent="▾";
    head.append(badge,st,mv,clone,del,caret);
    head.onclick=()=>{sec.open=!sec.open;block.classList.toggle('closed')};
    block.appendChild(head);
    const body=document.createElement('div');body.className="sec-block-body";
    const tl=document.createElement('label');tl.textContent="섹션 제목 (비우면 숨김)";
    const ti=document.createElement('input');ti.type="text";ti.value=sec.title||"";ti.oninput=e=>{sec.title=e.target.value;st.textContent=sec.title||"(제목 없음)";render()};
    body.append(tl,ti);
    if(sec.type==="timeline")buildTimelineBody(body,sec);
    else if(sec.type==="chips")buildChipsBody(body,sec);
    else if(sec.type==="lists")buildListsBody(body,sec);
    else if(sec.type==="fixed")buildFixedBody(body,sec);
    else if(sec.type==="notes")buildNotesBody(body,sec);
    block.appendChild(body);
    box.appendChild(block);
  });
}

/* ============ RENDER ============ */
function render(){
  readInputs();
  const s=data.style,card=document.getElementById('card');
  const vars={'--accent':s.accent,'--accent-2':s.accent2,'--soft':s.soft,'--bgA':s.bgA,'--bgB':s.bgB,'--panel':s.panel,'--line':s.line,'--ink':s.ink,'--muted':s.muted,'--panelSoft':s.panelSoft,'--fsTitle':s.fsTitle+"px",'--fsH2':s.fsH2+"px",'--fsBody':s.fsBody+"px",'--radius':s.radius+"px"};
  for(const k in vars)card.style.setProperty(k,vars[k]);
  card.innerHTML=buildCardHTML(false);
}

function sectionHTML(sec){
  let o="";
  const head=t=>`<div class="c-sec"><div class="c-sechead"><span class="c-dot"></span><h2>${esc(t)}</h2></div>`;
  if(sec.type==="timeline"){
    if(!(sec.title&&sec.months.length))return"";
    o+=head(sec.title)+`<div class="c-timeline">`;
    sec.months.forEach(m=>{
      if(m.label)o+=`<div class="c-month">${esc(m.label)}</div>`;
      m.events.forEach(ev=>{
        o+=`<div class="c-event${ev.big?' big':''}">`;
        if(ev.date)o+=`<span class="c-date">${esc(ev.date)}</span>`;
        o+=`${ev.big?'<b>':''}${esc(ev.text)}${ev.big?'</b>':''}`;
        if(ev.tag)o+=` <span class="c-tag">${esc(ev.tag)}</span>`;
        if(ev.with)o+=` <span class="c-with">w. ${esc(ev.with)}</span>`;
        o+=`</div>`;
      });
    });
    o+=`</div></div>`;
  }else if(sec.type==="chips"){
    if(!(sec.title&&sec.cards.length))return"";
    o+=head(sec.title);
    sec.cards.forEach(c=>{
      o+=`<div class="c-card"><h3>${esc(c.emoji)} ${esc(c.title)}</h3><div>`;
      (c.chips||[]).forEach(ch=>{o+=`<span class="c-chip">${esc(c.prefix?c.prefix+' ':'')}${esc(ch)}</span>`});
      o+=`</div></div>`;
    });
    o+=`</div>`;
  }else if(sec.type==="lists"){
    if(!(sec.title&&sec.cards.length))return"";
    o+=head(sec.title);
    sec.cards.forEach(c=>{
      o+=`<div class="c-card"><h3>${esc(c.emoji)} ${esc(c.title)}</h3>`;
      c.rows.forEach(r=>{o+=`<div class="c-listitem"><span class="c-date">${esc(r.date)}</span> ${esc(r.text)}</div>`});
      o+=`</div>`;
    });
    o+=`</div>`;
  }else if(sec.type==="fixed"){
    if(!(sec.title&&sec.items.length))return"";
    o+=head(sec.title);
    sec.items.forEach(f=>{o+=`<div class="c-fixed"><div class="lab">${esc(f.label)}</div><div class="val">${esc(f.val)}</div></div>`});
    o+=`</div>`;
  }else if(sec.type==="notes"){
    if(!(sec.title&&sec.items.length))return"";
    o+=head(sec.title);
    sec.items.forEach(n=>{o+=`<div class="c-note"><div class="h">${esc(n.head)}</div>`+(n.sub?`<div class="s">${esc(n.sub)}</div>`:"")+`</div>`});
    o+=`</div>`;
  }
  return o;
}

function buildCardHTML(inline){
  const h=data.header;let out="";
  if(h.title||h.badge||h.sub){
    out+=`<div class="c-hero">`;
    if(h.badge)out+=`<span class="c-badge">${esc(h.badge)}</span>`;
    if(h.title)out+=`<div class="c-title">${esc(h.title)}</div>`;
    if(h.sub)out+=`<p class="c-sub">${esc(h.sub)}</p>`;
    out+=`</div>`;
  }
  data.sections.forEach(sec=>{out+=sectionHTML(sec)});
  if(h.foot)out+=`<div class="c-foot">${esc(h.foot)}</div>`;
  if(!out)out=`<div class="c-empty">왼쪽 패널에서 섹션을 추가하고 내용을 채워주세요 ✍️</div>`;
  // for export, measure live card height so emojis spread over the full card in px
  let heightPx=0;
  if(inline){const cardEl=document.getElementById('card');heightPx=cardEl?cardEl.scrollHeight:0;}
  const deco=(inline&&window._noDecoOnCopy)?"":(inline?buildDeco(heightPx):buildDeco());
  const full=deco+`<div class="c-body">${out}</div>`;
  return inline?inlineStyles(full,heightPx):full;
}

/* ============ INLINE CONVERTER ============ */
function hexA(hex,a){const n=hex.replace('#','');return `rgba(${parseInt(n.slice(0,2),16)},${parseInt(n.slice(2,4),16)},${parseInt(n.slice(4,6),16)},${a})`}
function inlineStyles(inner,heightPx){
  const s=data.style;
  const tmp=document.createElement('div');tmp.innerHTML=`<div class="c-root">${inner}</div>`;
  const decoH=heightPx&&heightPx>0?`height:${heightPx}px;`:`top:0;left:0;right:0;bottom:0;`;
  const map={
    'c-root':`position:relative;overflow:hidden;max-width:820px;margin:0 auto;background:radial-gradient(1200px 600px at 50% -200px,${s.bgA} 0%,${s.bgB} 60%);color:${s.ink};font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;line-height:1.6;padding:40px 24px 56px;border-radius:16px`,
    'c-deco':`position:absolute;top:0;left:0;width:100%;${decoH}pointer-events:none;overflow:hidden;z-index:0`,
    'c-body':`position:relative;z-index:1`,
    'c-hero':`text-align:center;padding:16px 0 36px`,
    'c-badge':`display:block;width:fit-content;margin:0 auto 20px;font-size:13px;letter-spacing:2px;color:${s.accent};border:1px solid ${s.line};border-radius:999px;padding:6px 16px`,
    'c-title':`display:block;font-size:${s.fsTitle}px;font-weight:800;letter-spacing:-1px;line-height:1.15;margin:0;color:${s.accent}`,
    'c-sub':`color:${s.muted};margin:12px 0 0;font-size:16px`,
    'c-sec':`margin-top:44px`,
    'c-sechead':`display:flex;align-items:center;gap:12px;margin-bottom:20px`,
    'c-dot':`width:10px;height:10px;border-radius:50%;background:${s.accent};box-shadow:0 0 12px ${s.accent};flex:none`,
    'c-timeline':`padding-left:20px;border-left:2px solid ${s.soft}`,
    'c-month':`font-size:14px;font-weight:700;color:${s.accent};letter-spacing:1px;margin:24px 0 12px`,
    'c-event':`background:${s.panel};border:1px solid ${s.line};border-radius:${s.radius}px;padding:12px 16px;margin-bottom:10px;font-size:${s.fsBody}px`,
    'c-event big':`background:linear-gradient(120deg,${s.panelSoft},${s.panel});border:1px solid ${s.accent2};border-radius:${s.radius}px;padding:12px 16px;margin-bottom:10px;font-size:${s.fsBody}px`,
    'c-date':`color:${s.accent2};font-weight:700;font-size:13px;margin-right:10px`,
    'c-tag':`font-size:11px;color:#fff;background:${s.accent};padding:2px 8px;border-radius:6px;font-weight:700;margin-left:6px`,
    'c-with':`color:${s.muted};font-size:13px`,
    'c-card':`background:${s.panel};border:1px solid ${s.line};border-radius:14px;padding:20px;margin-bottom:14px`,
    'c-chip':`display:inline-block;font-size:13px;background:${s.panelSoft};border:1px solid ${s.line};padding:5px 11px;border-radius:8px;margin:0 6px 8px 0`,
    'c-listitem':`padding:9px 0;border-bottom:1px solid ${s.line};font-size:14px`,
    'c-fixed':`background:${s.panel};border:1px solid ${s.line};border-radius:${s.radius}px;padding:14px 16px;margin-bottom:12px`,
    'lab':`font-size:12px;color:${s.muted};margin-bottom:4px`,
    'val':`font-size:15px;font-weight:600`,
    'c-note':`background:linear-gradient(120deg,${hexA(s.accent,.1)},transparent);border:1px dashed ${s.accent};border-radius:12px;padding:16px 18px;font-size:14px;margin-bottom:12px`,
    'c-foot':`text-align:center;color:${s.muted};font-size:13px;margin-top:52px`
  };
  tmp.querySelectorAll('*').forEach(el=>{
    const cls=el.getAttribute('class')||"";
    if(map[cls]!==undefined)el.setAttribute('style',map[cls]);
    else if(el.tagName==='H3')el.setAttribute('style',`font-size:15px;color:${s.accent};margin-bottom:12px`);
    else if(cls==='h')el.setAttribute('style',`color:${s.accent};font-weight:700;margin-bottom:6px`);
    else if(cls==='s')el.setAttribute('style',`color:${s.muted};font-size:13px`);
    el.removeAttribute('class');
  });
  tmp.querySelectorAll('h2').forEach(el=>el.setAttribute('style',`font-size:${s.fsH2}px;font-weight:700;margin:0`));
  return tmp.innerHTML;
}

/* migrate old fixed-key format -> array sections */
function migrate(d){
  if(Array.isArray(d.sections))return d;
  const out={header:d.header||{title:"",badge:"",sub:"",foot:""},style:Object.assign({},data.style,d.style||{}),sections:[]};
  const order=Array.isArray(d.sectionOrder)?d.sectionOrder:["timeline","chips","lists","fixed","notes"];
  order.forEach(key=>{
    if(key==="timeline"&&d.timeline)out.sections.push({id:uid(),type:"timeline",title:d.timeline.title||"",months:d.timeline.months||[],open:false});
    if(key==="chips"&&d.chips)out.sections.push({id:uid(),type:"chips",title:d.chips.title||"",cards:d.chips.cards||[],open:false});
    if(key==="lists"&&d.lists)out.sections.push({id:uid(),type:"lists",title:d.lists.title||"",cards:d.lists.cards||[],open:false});
    if(key==="fixed"&&d.fixed)out.sections.push({id:uid(),type:"fixed",title:d.fixed.title||"",items:d.fixed.items||[],open:false});
    if(key==="notes"&&d.notes)out.sections.push({id:uid(),type:"notes",title:d.notes.title||"",items:d.notes.items||[],open:false});
  });
  return out;
}
function importJSON(e){
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{
    let d=migrate(JSON.parse(r.result));
    data=Object.assign({header:{},style:{},deco:{emojis:"",count:18,size:34,opacity:14,seed:7},sections:[]},d);
    if(!data.deco)data.deco={emojis:"",count:18,size:34,opacity:14,seed:7};
    data.sections.forEach(sec=>{sec.id=sec.id||uid();sec.open=false;(sec.months||[]).forEach(m=>{m.id=m.id||uid();(m.events||[]).forEach(ev=>ev.id=ev.id||uid())});(sec.cards||[]).forEach(c=>{c.id=c.id||uid();(c.rows||[]).forEach(rw=>rw.id=rw.id||uid())});(sec.items||[]).forEach(i=>i.id=i.id||uid())});
    hydrate();toast("불러왔어요");
  }catch(err){console.error(err);toast("파일을 읽을 수 없어요")}};
  r.readAsText(f);e.target.value="";
}
function saveImage(){
  readInputs();const card=document.getElementById('card');toast("이미지를 만드는 중...");
  html2canvas(card,{scale:2,backgroundColor:null,useCORS:true}).then(canvas=>{
    const a=document.createElement('a');a.href=canvas.toDataURL('image/png');a.download="약력.png";a.click();toast("이미지를 저장했어요");
  }).catch(()=>toast("이미지 저장에 실패했어요"));
}
